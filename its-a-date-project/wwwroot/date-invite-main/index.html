<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Will You Go On A Date With Me?</title>
<style>
  :root{
    --bg-1:#ffeaf4;
    --bg-2:#ffd2e6;
    --card-bg:#fffbfd;
    --ink:#5c1f3d;
    --ink-soft:#93486e;
    --accent:#ff5c9e;
    --accent-deep:#e0227a;
    --accent-soft:#ffd3e7;
    --gold:#ffb84d;
    --border:#ffcfe4;
    --shadow:rgba(224,34,122,0.18);
  }
  /* Deliberately single-themed (pink, always) so it looks the same on every device regardless of system dark mode. */
  :root{ color-scheme: light; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  .stage{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
    overflow:hidden;
    background:
      radial-gradient(60% 50% at 50% 8%, var(--bg-1) 0%, transparent 70%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }

  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .hearts span{
    position:absolute;
    bottom:-10%;
    font-size:1.4rem;
    color:var(--accent);
    opacity:0.55;
    animation:float 11s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .hearts span{animation:none;display:none;}
    .card, #yes-btn, #no-btn, #submit-btn, .burst span, .heart-burst-item{transition:none !important; animation:none !important;}
  }
  @keyframes float{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    10%{opacity:0.6;}
    100%{transform:translateY(-115vh) rotate(25deg);opacity:0;}
  }

  @keyframes glow{
    0%,100%{box-shadow:0 10px 24px -8px var(--shadow);}
    50%{box-shadow:0 12px 30px -4px var(--accent);}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(-5deg);}
    75%{transform:rotate(5deg);}
  }

  .card{
    position:relative;
    z-index:2;
    width:min(460px,92vw);
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:28px;
    padding:clamp(2rem,5vw,3rem) clamp(1.6rem,5vw,2.6rem);
    box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 var(--border) inset;
    text-align:center;
    transform:rotate(-0.6deg);
  }

  .eyebrow{
    display:inline-block;
    font-family:"Segoe Script","Bradley Hand","Brush Script MT",cursive;
    font-size:1.25rem;
    color:var(--accent-deep);
    margin:0 0 0.2rem;
    transform:rotate(-2deg);
  }

  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.9rem,6vw,2.7rem);
    line-height:1.15;
    margin:0.2rem 0 0.6rem;
    text-wrap:balance;
    color:var(--ink);
  }

  .sub{
    font-size:0.98rem;
    color:var(--ink-soft);
    margin:0 0 1.8rem;
    line-height:1.5;
  }

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:1rem;
    justify-content:center;
    align-items:center;
    min-height:64px;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:999px;
    font-size:1.02rem;
    font-weight:600;
    letter-spacing:0.01em;
    padding:0.85rem 1.9rem;
  }
  button:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }

  #yes-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#fff;
    box-shadow:0 10px 24px -8px var(--shadow);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    animation:glow 1.7s ease-in-out infinite;
  }
  #yes-btn:hover{transform:translateY(-2px) scale(1.04);}

  #no-btn{
    background:var(--accent-soft);
    color:var(--ink);
    transition:transform 0.18s ease, left 0.28s cubic-bezier(.2,.9,.3,1.3), top 0.28s cubic-bezier(.2,.9,.3,1.3);
    animation:wiggle 2.6s ease-in-out infinite;
  }
  #no-btn.roaming{
    position:absolute;
    z-index:20;
    animation:none;
  }

  .helper{
    margin-top:1.4rem;
    font-size:0.88rem;
    color:var(--ink-soft);
    min-height:1.2em;
  }

  form{display:flex;flex-direction:column;gap:1.1rem;text-align:left;}
  label{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    display:block;
    margin-bottom:0.4rem;
  }
  input[type="date"], input[type="time"]{
    color-scheme: light;
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding:0.75rem 0.9rem;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--bg-1);
    color:var(--ink);
    -webkit-text-fill-color:var(--ink);
  }
  input[type="date"]:focus, input[type="time"]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .field-row{display:flex;gap:0.8rem;}
  .field-row > div{flex:1;min-width:0;}
  @media (max-width:480px){
    .field-row{flex-direction:column;gap:1.1rem;}
  }

  #submit-btn{
    margin-top:0.3rem;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#fff;
    width:100%;
    box-shadow:0 10px 24px -8px var(--shadow);
    transition:transform 0.2s ease;
    animation:glow 1.7s ease-in-out infinite;
  }
  #submit-btn:hover{transform:translateY(-2px);}

  .thanks-msg{
    font-size:1.02rem;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 0.4rem;
  }
  .love-line{
    font-family:Georgia,"Iowan Old Style",serif;
    font-style:italic;
    font-size:1.3rem;
    color:var(--accent-deep);
    margin:1.1rem 0 0;
  }

  .scene{display:none;animation:fadeIn 0.5s ease;}
  .scene.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .burst{position:relative;height:0;}
  .burst span{
    position:absolute;
    left:50%;top:0;
    font-size:1.3rem;
    animation:pop 1.1s ease-out forwards;
  }
  @keyframes pop{
    0%{transform:translate(-50%,0) scale(0.4);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), -80px) scale(1);opacity:0;}
  }

  .heart-burst-item{
    position:fixed;
    left:0;top:0;
    pointer-events:none;
    z-index:60;
    font-size:1.4rem;
    animation:burstPop 1s ease-out forwards;
  }
  @keyframes burstPop{
    0%{transform:translate(-50%,-50%) scale(0.3);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1);opacity:0;}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hearts" id="hearts"></div>

  <div class="card" id="card">

    <section class="scene active" id="scene-ask">
      <p class="eyebrow">a very important question</p>
      <h1>Will you go on a date with me?</h1>
      <p class="sub">Take your time. Well&nbsp;&mdash; not too much time.</p>
      <div class="btn-row" id="btn-row">
        <button id="yes-btn" type="button">Yes 💗</button>
        <button id="no-btn" type="button">No</button>
      </div>
      <p class="helper" id="helper" aria-live="polite">&nbsp;</p>
    </section>

    <section class="scene" id="scene-plan">
      <p class="eyebrow">yay!! 💌</p>
      <h1 style="font-size:clamp(1.6rem,5vw,2.1rem);">Let's pick the day</h1>
      <p class="sub">Choose whenever suits you best.</p>
      <form id="plan-form">
        <div class="field-row">
          <div>
            <label for="date-input">Date</label>
            <input type="date" id="date-input" required>
          </div>
          <div>
            <label for="time-input">Time</label>
            <input type="time" id="time-input" required>
          </div>
        </div>
        <button id="submit-btn" type="submit">Lock it in</button>
      </form>
    </section>

    <section class="scene" id="scene-thanks">
      <p class="eyebrow">it's a date 💕</p>
      <h1 style="font-size:clamp(1.6rem,5vw,2.1rem);">Thank you!</h1>
      <p class="thanks-msg" id="thanks-msg"></p>
      <p class="love-line">I love you so much.</p>
      <div class="burst" id="burst"></div>
    </section>

  </div>
</div>

<script>
(function(){
  var heartsHost = document.getElementById('hearts');
  var glyphs = ['💗','💖','💕','💓'];
  for (var i = 0; i < 22; i++){
    var s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 11) + 's';
    s.style.animationDuration = (9 + Math.random() * 6) + 's';
    s.style.fontSize = (1 + Math.random() * 1.3) + 'rem';
    heartsHost.appendChild(s);
  }

  var card = document.getElementById('card');
  var noBtn = document.getElementById('no-btn');
  var yesBtn = document.getElementById('yes-btn');
  var helper = document.getElementById('helper');
  var dodges = 0;
  var lines = [
    'huh, missed me',
    'is that a yes?',
    'come on now 🙂',
    "you can't catch this button",
    'pretty please?',
    "I'll just wait here 💗"
  ];

  function reduceMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  var burstGlyphs = ['💖','💗','💕','✨','💓'];

  function heartBurst(x, y, count){
    if (reduceMotion()) return;
    for (var i = 0; i < count; i++){
      var sp = document.createElement('span');
      sp.className = 'heart-burst-item';
      sp.textContent = burstGlyphs[i % burstGlyphs.length];
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 110;
      sp.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      sp.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      sp.style.left = x + 'px';
      sp.style.top = y + 'px';
      sp.style.fontSize = (1 + Math.random() * 0.8) + 'rem';
      sp.style.animationDelay = (Math.random() * 0.15) + 's';
      document.body.appendChild(sp);
      (function(el){
        setTimeout(function(){ el.remove(); }, 1300);
      })(sp);
    }
  }

  function dodge(){
    if (reduceMotion()) return;
    var w = noBtn.offsetWidth || 100;
    var h = noBtn.offsetHeight || 44;
    var pad = 18;
    var maxX = Math.max(0, card.clientWidth - w - pad * 2);
    var maxY = Math.max(0, card.clientHeight - h - pad * 2);
    var x = pad + Math.random() * maxX;
    var y = pad + Math.random() * maxY;

    if (!noBtn.classList.contains('roaming')){
      noBtn.classList.add('roaming');
    }
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    dodges++;
    var scale = Math.min(1.5, 1 + dodges * 0.05);
    yesBtn.style.transform = 'scale(' + scale + ')';
    helper.textContent = lines[Math.min(dodges - 1, lines.length - 1)];
  }

  var SAFE_DIST = 130;
  var MIN_INTERVAL = 220;
  var lastDodge = 0;

  function checkProximity(x, y){
    if (reduceMotion()) return;
    var rect = noBtn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dist = Math.hypot(x - cx, y - cy);
    var now = Date.now();
    if (dist < SAFE_DIST && now - lastDodge > MIN_INTERVAL){
      lastDodge = now;
      dodge();
    }
  }

  document.addEventListener('mousemove', function(e){
    checkProximity(e.clientX, e.clientY);
  }, { passive: true });

  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]) checkProximity(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    lastDodge = Date.now();
    dodge();
  }, { passive: false });

  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    lastDodge = Date.now();
    dodge();
  });

  function showScene(id){
    document.querySelectorAll('.scene').forEach(function(el){
      el.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
  }

  yesBtn.addEventListener('click', function(){
    var r = yesBtn.getBoundingClientRect();
    heartBurst(r.left + r.width / 2, r.top + r.height / 2, 26);
    showScene('scene-plan');
  });

  document.getElementById('plan-form').addEventListener('submit', function(e){
    e.preventDefault();
    var dateVal = document.getElementById('date-input').value;
    var timeVal = document.getElementById('time-input').value;
    if (!dateVal || !timeVal) return;

    var d = new Date(dateVal + 'T' + timeVal);
    var dateStr = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    var timeStr = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

    document.getElementById('thanks-msg').textContent =
      "I can't wait to see you on " + dateStr + ' at ' + timeStr + '.';

    showScene('scene-thanks');

    if (!reduceMotion()){
      var burst = document.getElementById('burst');
      burst.innerHTML = '';
      var g = ['💖','💗','💕','✨','💓'];
      for (var i = 0; i < 16; i++){
        var sp = document.createElement('span');
        sp.textContent = g[i % g.length];
        sp.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
        sp.style.left = (35 + Math.random() * 30) + '%';
        sp.style.animationDelay = (Math.random() * 0.3) + 's';
        burst.appendChild(sp);
      }
    }
  });
})();
</script>
</body>
</html>
